seed: 42
run_name: local

paths:
  data_dir: ../data
  checkpoint_dir: checkpoints/local
  output_dir: outputs/local

data:
  image_size: 64
  load_size: 72
  monet_limit: 20
  photo_limit: 20
  num_workers: 0

train:
  total_steps: 300
  decay_start: 150
  batch_size: 1
  lr: 2.0e-4
  betas: [0.5, 0.999]
  ema_decay: 0.95
  pool_size: 50
  lambda_cycle: 10
  lambda_identity: 5
  diffaug: "color,translation,cutout"
  ckpt_every: 100
  eval_every: 150
  eval_photos: 20
  log_every: 20

model:
  n_res_blocks: 9
  ngf: 64
  ndf: 64
