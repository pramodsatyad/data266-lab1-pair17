seed: 42
run_name: gpu_arch2

paths:
  data_dir: ../data
  checkpoint_dir: checkpoints/gpu_arch2
  output_dir: outputs/gpu_arch2

data:
  image_size: 256
  load_size: 286
  monet_limit: null
  photo_limit: null
  num_workers: 4

train:
  total_steps: 100000
  decay_start: 50000
  batch_size: 1
  lr: 2.0e-4
  betas: [0.5, 0.999]
  ema_decay: 0.999
  pool_size: 50
  lambda_cycle: 5
  lambda_identity: 0.5
  diffaug: "color,translation,cutout"
  ckpt_every: 5000
  eval_every: 5000
  eval_photos: 1000
  log_every: 200
  quick_metric: official

model:
  n_res_blocks: 9
  ngf: 64
  ndf: 64
  upsample: resize
  d_scales: 2
  spectral_norm: false

output:
  jpg_quality: 95
