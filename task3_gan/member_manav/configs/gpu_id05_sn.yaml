seed: 42
run_name: gpu_id05_sn

paths:
  data_dir: ../data
  checkpoint_dir: checkpoints/gpu_id05_sn
  output_dir: outputs/gpu_id05_sn

data:
  image_size: 256
  load_size: 286
  monet_limit: null
  photo_limit: null
  num_workers: 4

train:
  total_steps: 60000
  decay_start: 30000
  batch_size: 1
  lr: 2.0e-4
  betas: [0.5, 0.999]
  ema_decay: 0.999
  pool_size: 50
  lambda_cycle: 10
  lambda_identity: 0.5
  diffaug: "color,translation,cutout"
  ckpt_every: 5000
  eval_every: 5000
  eval_photos: 1000
  log_every: 200
  quick_metric: official

model:
  n_res_blocks: 9
  ngf: 64
  ndf: 64
  spectral_norm: true

output:
  jpg_quality: 100
